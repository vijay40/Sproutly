openapi: 3.1.0
info:
  title: Sproutly REST API
  version: 0.0.0
  description: Phase A scaffold. See docs/superpowers/specs/2026-05-11-rest-api-design.md
servers:
  - url: http://localhost:8787
    description: Local dev default. In Insomnia, change Base URL for LAN IP or staging. (Insomnia requires a literal URL or
      OpenAPI server variables with defaults, not brace-only placeholders.)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
  parameters: {}
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  version:
                    type: string
                required:
                  - ok
                  - version
  /me:
    get:
      summary: Current parent profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  family_id:
                    type:
                      - string
                      - "null"
                    format: uuid
                  timezone:
                    type:
                      - string
                      - "null"
                  has_onboarded:
                    type: boolean
                required:
                  - user_id
                  - family_id
                  - timezone
                  - has_onboarded
    patch:
      summary: Update current parent profile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  family_id:
                    type:
                      - string
                      - "null"
                    format: uuid
                  timezone:
                    type:
                      - string
                      - "null"
                  has_onboarded:
                    type: boolean
                required:
                  - user_id
                  - family_id
                  - timezone
                  - has_onboarded
  /families:
    post:
      summary: Bootstrap the family row for the signed-in parent
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  minLength: 1
              required:
                - timezone
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  parent_user_id:
                    type: string
                    format: uuid
                  timezone:
                    type: string
                  created_at:
                    type: string
                required:
                  - id
                  - parent_user_id
                  - timezone
                  - created_at
        "409":
          description: Family already exists for this parent
  /children:
    get:
      summary: List children in the current family
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    family_id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    age:
                      type:
                        - integer
                        - "null"
                    avatar_emoji:
                      type:
                        - string
                        - "null"
                    successful_days:
                      type: integer
                    last_evaluated_date:
                      type:
                        - string
                        - "null"
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    pending_stage_transition:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
                  required:
                    - id
                    - family_id
                    - name
                    - age
                    - avatar_emoji
                    - successful_days
                    - last_evaluated_date
                    - pending_stage_transition
                    - created_at
    post:
      summary: "Create a child (V1: one child per family)"
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                age:
                  type: integer
                  minimum: 3
                  maximum: 12
                avatar_emoji:
                  type: string
              required:
                - name
              additionalProperties: false
            examples:
              default:
                value:
                  name: Alex
                  age: 7
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  family_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  age:
                    type:
                      - integer
                      - "null"
                  avatar_emoji:
                    type:
                      - string
                      - "null"
                  successful_days:
                    type: integer
                  last_evaluated_date:
                    type:
                      - string
                      - "null"
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  pending_stage_transition:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                required:
                  - id
                  - family_id
                  - name
                  - age
                  - avatar_emoji
                  - successful_days
                  - last_evaluated_date
                  - pending_stage_transition
                  - created_at
  /children/{id}:
    patch:
      summary: Partially update a child
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                age:
                  type:
                    - integer
                    - "null"
                  minimum: 3
                  maximum: 12
                avatar_emoji:
                  type:
                    - string
                    - "null"
              additionalProperties: false
            examples:
              name:
                value:
                  name: Alex
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  family_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  age:
                    type:
                      - integer
                      - "null"
                  avatar_emoji:
                    type:
                      - string
                      - "null"
                  successful_days:
                    type: integer
                  last_evaluated_date:
                    type:
                      - string
                      - "null"
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  pending_stage_transition:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                required:
                  - id
                  - family_id
                  - name
                  - age
                  - avatar_emoji
                  - successful_days
                  - last_evaluated_date
                  - pending_stage_transition
                  - created_at
  /tasks:
    get:
      summary: List tasks for the current family
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    child_id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    icon:
                      type:
                        - string
                        - "null"
                    category:
                      type: string
                      enum: &a2
                        - routine
                        - chore
                        - behavior
                    time_slot:
                      type: string
                      enum: &a3
                        - morning
                        - afternoon
                        - evening
                    difficulty:
                      type: integer
                      minimum: 1
                      maximum: 3
                    recurrence:
                      type: string
                      enum: &a1
                        - daily
                        - weekdays
                        - custom
                        - one_time
                    recurrence_days:
                      type:
                        - array
                        - "null"
                      items:
                        type: integer
                    is_bonus:
                      type: boolean
                    is_active:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time
                  required:
                    - id
                    - child_id
                    - title
                    - icon
                    - category
                    - time_slot
                    - difficulty
                    - recurrence
                    - recurrence_days
                    - is_bonus
                    - is_active
                    - created_at
    post:
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                category:
                  type: string
                  enum:
                    - routine
                    - chore
                    - behavior
                time_slot:
                  type: string
                  enum:
                    - morning
                    - afternoon
                    - evening
                recurrence:
                  type: string
                  enum: *a1
                icon:
                  type:
                    - string
                    - "null"
                difficulty:
                  type: integer
                  minimum: 1
                  maximum: 3
                recurrence_days:
                  type:
                    - array
                    - "null"
                  items:
                    type: integer
                is_bonus:
                  type: boolean
              required:
                - child_id
                - title
                - category
                - time_slot
                - recurrence
              additionalProperties: false
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  child_id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  icon:
                    type:
                      - string
                      - "null"
                  category:
                    type: string
                    enum: *a2
                  time_slot:
                    type: string
                    enum: *a3
                  difficulty:
                    type: integer
                    minimum: 1
                    maximum: 3
                  recurrence:
                    type: string
                    enum: *a1
                  recurrence_days:
                    type:
                      - array
                      - "null"
                    items:
                      type: integer
                  is_bonus:
                    type: boolean
                  is_active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                required:
                  - id
                  - child_id
                  - title
                  - icon
                  - category
                  - time_slot
                  - difficulty
                  - recurrence
                  - recurrence_days
                  - is_bonus
                  - is_active
                  - created_at
  /tasks/{id}:
    patch:
      summary: Update a task
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                category:
                  type: string
                  enum:
                    - routine
                    - chore
                    - behavior
                time_slot:
                  type: string
                  enum:
                    - morning
                    - afternoon
                    - evening
                recurrence:
                  type: string
                  enum: *a1
                icon:
                  type:
                    - string
                    - "null"
                difficulty:
                  type: integer
                  minimum: 1
                  maximum: 3
                recurrence_days:
                  type:
                    - array
                    - "null"
                  items:
                    type: integer
                is_bonus:
                  type: boolean
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  child_id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  icon:
                    type:
                      - string
                      - "null"
                  category:
                    type: string
                    enum: *a2
                  time_slot:
                    type: string
                    enum: *a3
                  difficulty:
                    type: integer
                    minimum: 1
                    maximum: 3
                  recurrence:
                    type: string
                    enum: *a1
                  recurrence_days:
                    type:
                      - array
                      - "null"
                    items:
                      type: integer
                  is_bonus:
                    type: boolean
                  is_active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                required:
                  - id
                  - child_id
                  - title
                  - icon
                  - category
                  - time_slot
                  - difficulty
                  - recurrence
                  - recurrence_days
                  - is_bonus
                  - is_active
                  - created_at
    delete:
      summary: Soft-delete a task (sets is_active=false)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  child_id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  icon:
                    type:
                      - string
                      - "null"
                  category:
                    type: string
                    enum: *a2
                  time_slot:
                    type: string
                    enum: *a3
                  difficulty:
                    type: integer
                    minimum: 1
                    maximum: 3
                  recurrence:
                    type: string
                    enum: *a1
                  recurrence_days:
                    type:
                      - array
                      - "null"
                    items:
                      type: integer
                  is_bonus:
                    type: boolean
                  is_active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                required:
                  - id
                  - child_id
                  - title
                  - icon
                  - category
                  - time_slot
                  - difficulty
                  - recurrence
                  - recurrence_days
                  - is_bonus
                  - is_active
                  - created_at
  /daily-summaries:
    get:
      summary: List daily summaries for a child
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    child_id:
                      type: string
                      format: uuid
                    local_date:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    total_tasks:
                      type: integer
                    completed_tasks:
                      type: integer
                    was_successful:
                      type: boolean
                    simplified_from_miss:
                      type: boolean
                  required:
                    - child_id
                    - local_date
                    - total_tasks
                    - completed_tasks
                    - was_successful
                    - simplified_from_miss
  /insights:
    get:
      summary: List AI insights for the family
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    family_id:
                      type: string
                      format: uuid
                    insight_text:
                      type: string
                    suggestion_type:
                      type:
                        - string
                        - "null"
                      enum: &a4
                        - difficulty_up
                        - difficulty_down
                        - reschedule
                        - break_task
                        - simplify_tomorrow
                        - generic
                    task_id:
                      type:
                        - string
                        - "null"
                      format: uuid
                    is_applied:
                      type: boolean
                    is_dismissed:
                      type: boolean
                    generated_at:
                      type: string
                      format: date-time
                    passed_safety_filter:
                      type: boolean
                  required:
                    - id
                    - family_id
                    - insight_text
                    - suggestion_type
                    - task_id
                    - is_applied
                    - is_dismissed
                    - generated_at
                    - passed_safety_filter
  /insights/{id}/apply:
    post:
      summary: Mark insight as applied (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  family_id:
                    type: string
                    format: uuid
                  insight_text:
                    type: string
                  suggestion_type:
                    type:
                      - string
                      - "null"
                    enum: *a4
                  task_id:
                    type:
                      - string
                      - "null"
                    format: uuid
                  is_applied:
                    type: boolean
                  is_dismissed:
                    type: boolean
                  generated_at:
                    type: string
                    format: date-time
                  passed_safety_filter:
                    type: boolean
                required:
                  - id
                  - family_id
                  - insight_text
                  - suggestion_type
                  - task_id
                  - is_applied
                  - is_dismissed
                  - generated_at
                  - passed_safety_filter
  /insights/{id}/dismiss:
    post:
      summary: Mark insight as dismissed (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  family_id:
                    type: string
                    format: uuid
                  insight_text:
                    type: string
                  suggestion_type:
                    type:
                      - string
                      - "null"
                    enum: *a4
                  task_id:
                    type:
                      - string
                      - "null"
                    format: uuid
                  is_applied:
                    type: boolean
                  is_dismissed:
                    type: boolean
                  generated_at:
                    type: string
                    format: date-time
                  passed_safety_filter:
                    type: boolean
                required:
                  - id
                  - family_id
                  - insight_text
                  - suggestion_type
                  - task_id
                  - is_applied
                  - is_dismissed
                  - generated_at
                  - passed_safety_filter
  /task-completions:
    post:
      summary: Mark task complete for a local date (idempotent)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: string
                  format: uuid
                child_id:
                  type: string
                  format: uuid
                local_date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
              required:
                - task_id
                - child_id
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  completion:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      task_id:
                        type: string
                        format: uuid
                      child_id:
                        type: string
                        format: uuid
                      local_date:
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                      completed_at:
                        type: string
                        format: date-time
                      marked_by_parent:
                        type: boolean
                    required:
                      - id
                      - task_id
                      - child_id
                      - local_date
                      - completed_at
                      - marked_by_parent
                  idempotent:
                    type: boolean
                required:
                  - completion
                  - idempotent
    get:
      summary: List task completions for a child on a local date
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    task_id:
                      type: string
                      format: uuid
                    child_id:
                      type: string
                      format: uuid
                    local_date:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    completed_at:
                      type: string
                      format: date-time
                    marked_by_parent:
                      type: boolean
                  required:
                    - id
                    - task_id
                    - child_id
                    - local_date
                    - completed_at
                    - marked_by_parent
  /task-completions/{id}:
    delete:
      summary: Undo a task completion by id (parent only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                required:
                  - deleted
  /day-roll:
    post:
      summary: Run lazy day-roll catch-up through yesterday; optional evaluate_today for same-day evolution
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child_id:
                  type: string
                  format: uuid
                evaluate_today:
                  type: boolean
                clear_pending_stage_transition:
                  type: boolean
              additionalProperties: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rolled:
                    type: boolean
                  today_local_date:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  summaries:
                    type: array
                    items:
                      type: object
                      properties:
                        child_id:
                          type: string
                          format: uuid
                        local_date:
                          type: string
                          pattern: ^\d{4}-\d{2}-\d{2}$
                        total_tasks:
                          type: integer
                        completed_tasks:
                          type: integer
                        was_successful:
                          type: boolean
                        stage_bumped:
                          type: boolean
                        new_stage:
                          type: integer
                        miss_simplify_draft_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                      required:
                        - child_id
                        - local_date
                        - total_tasks
                        - completed_tasks
                        - was_successful
                        - stage_bumped
                        - new_stage
                        - miss_simplify_draft_id
                  reason:
                    type: string
                    enum:
                      - no_children
                required:
                  - rolled
                  - today_local_date
                  - summaries
  /dev/impersonate:
    post:
      summary: Mint a dev-only access token (non-production only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                required:
                  - access_token
                  - expires_at
  /openapi.yaml:
    get:
      summary: OpenAPI document (dev only on server)
      responses:
        "200":
          description: YAML document
          content:
            text/yaml:
              schema:
                type: string
webhooks: {}
